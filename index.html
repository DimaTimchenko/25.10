
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>

    <style>
        input, select, textarea {
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            background: black;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

<form>
    <h1>Contact</h1>

    <p>First name</p>
    <input type="text" placeholder="First name" required>

    <p>Last name</p>
    <input type="text" placeholder="Last name" required>

    <p>Phone</p>
    <input type="tel" placeholder="Phone number" required>

    <p>Email</p>
    <input type="email"
           placeholder="@gmail.com"
           pattern="[A-Za-z][A-Za-z0-9]*@(gmail\.com|ukr\.net|itstep\.academy|itstep\.org)"
           title="Use gmail.com, ukr.net, itstep.academy or itstep.org"
           required>

    <p>Password</p>
    <input type="password"
           placeholder="6-10"
           pattern="[A-Za-z0-9]{6,10}"
           title="Use 6 to 10 English letters or numbers"
           required>

    <p>Date and time</p>

    Day:
    <input type="number" min="1" max="31"
           style="width: 45px;">

    Month:
    <select>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>

    <p>Year</p>
    <input type="number" min="2026">

    <p>Time</p>
    <input type="time">

    <p>Seating preference</p>

    <input type="radio" name="seat"> Indoor
    <br>
    <input type="radio" name="seat"> Outdoor

    <p>Additional requests</p>
    <textarea rows="3" cols="35"
              placeholder="Your requests"></textarea>

    <br>

    <input type="checkbox">
    subscribe

    <br><br>

    <button type="submit">Request booking</button>

</form>

</body>
</html>
