
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data</title>

    <style>
        .ok {
            display: none;
            color: green;
        }

        input:valid + .ok {
            display: inline;
        }
    </style>
</head>
<body>

    <h1>Data Validation</h1>

    <h3>Password</h3>
    <form>
        <input type="text"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%\^&amp;\*])\S{8,20}"
               placeholder="Enter password"
               required>
        <span class="ok">✔</span>
        <button type="submit">Check</button>
    </form>

    <hr>

    <h3>Date</h3>
    <form>
        <input type="text"
               pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(202[4-9]|20[3-9][0-9])"
               placeholder="DD.MM.YYYY"
               required>
        <span class="ok">✔</span>
        <button type="submit">Check</button>
    </form>

    <hr>

    <h3>Name</h3>
    <form>
        <input type="text"
               pattern="[a-zA-Z0-9]+(_[a-zA-Z0-9]+)*"
               placeholder="name"
               required>
        <span class="ok">✔</span>
        <button type="submit">Check</button>
    </form>

    <hr>

    <h3>4. HEX Color</h3>
    <form>
        <input type="text"
               pattern="#([a-fA-F0-9]{3}|[a-fA-F0-9]{6})"
               placeholder="#FFF or #FF00AA"
               required>
        <span class="ok">✔</span>
        <button type="submit">Check</button>
    </form>

</body>
</html>
