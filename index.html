
<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<style>
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 350px);
        gap: 20px;
        
    }

    .column {
        display: grid;
        gap: 20px;
        align-content: start;
    }

    .column:nth-child(1) {
        grid-template-rows: 150px 220px 100px;
    }

    .column:nth-child(2) {
        grid-template-rows: 100px 230px 150px;
    }

    .column:nth-child(3) {
        grid-template-rows: 100px 350px 150px;
    }

    .box {
        background: #c4c4c4;
    }
</style>
</head>
<body>

<div class="grid">
    <div class="column">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="column">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="column">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</div>

</body>
</html>
